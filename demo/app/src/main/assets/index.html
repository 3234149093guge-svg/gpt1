ly:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;line-height:1.55}.markdown h1{font-size:21px;margin:24px 0 10px}.markdown h2{font-size:18px;margin:23px 0 9px}.markdown h3{font-size:15px;margin:19px 0 8px}.markdown p{margin:8px 0 13px}.markdown li{margin:7px 0}.markdown ul{padding-left:23px}.markdown blockquote{border-left:2px solid var(--ochre);color:var(--soft);margin:15px 0;padding:3px 14px}.tools{position:sticky;bottom:-24px;background:linear-gradient(to top,var(--paper) 75%,#f8f7f300);padding:25px 0 max(14px,env(safe-area-inset-bottom));display:flex;gap:7px}.tools .btn{flex:1}.notice{border-left:2px solid var(--ochre);background:#f3efe7;padding:11px 13px;color:#7c6b56;font-size:11px;line-height:1.7;border-radius:0 8px 8px 0}.badge{font-size:10px;border:1px solid #d4dfd3;background:#eaf1e7;color:#486652;border-radius:5px;padding:4px 7px}.modalwrap{position:absolute;inset:0;background:#192b2599;display:flex;justify-content:center;align-items:flex-end;z-index:30}.modal{max-height:88%;width:100%;background:var(--paper);border-radius:23px 23px 0 0;overflow-y:auto;padding:18px 23px max(25px,env(safe-area-inset-bottom));box-shadow:0 -9px 40px #1f292522}.modal h2{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:21px;margin:10px 0 18px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:29px;height:29px;border-radius:50%;background:#e9e8e0;color:var(--soft);font-size:16px}.label{font-size:11px;color:var(--soft);display:block;margin:12px 0 7px}.actionlist button{display:block;padding:14px 0;width:100%;text-align:left;background:transparent;border-bottom:1px solid var(--line);color:var(--ink);font-size:13px}.cardqa{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:29px 22px;margin:25px 0;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.cardqa .question{font-size:22px;font-family:"Noto Serif SC","Songti SC","STSong",serif;line-height:1.7}.cardqa .answer{font-size:14px;line-height:1.9;margin-top:16px;white-space:pre-line}.chatbubble{padding:13px 14px;border-radius:11px;margin:10px 0;font-size:13px;line-height:1.8;white-space:pre-line;background:var(--white);border:1px solid var(--line)}.chatbubble.user{background:#e6eee6;margin-left:35px}.sheetrow{display:flex;gap:9px}.sheetrow>*{flex:1}.empty{padding:43px 10px;text-align:center;color:var(--soft);font-size:13px;line-height:2}.iconbtn{background:transparent;color:var(--ink);padding:6px}.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#23382f;color:white;padding:10px 15px;border-radius:22px;font-size:12px;z-index:40;max-width:90%} .actions{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.strong{font-weight:700}.catalog{font-size:13px;color:var(--soft);font-family:Georgia,serif}.task{padding:14px;background:var(--white);border:1px solid var(--line);border-radius:12px;margin:10px 0 19px}.taskline{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:11px}@media(min-width:600px){.app{height:min(920px,100vh);margin:0 auto;border-radius:8px}}@media print{.nav,.top,.tools,.btn,.link,.tabs{display:none!important}.app,.main{height:auto;overflow:visible;box-shadow:none}.modalwrap{display:none}}

const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',library:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',review:'<path d="M12 3a9 9 0 1 0 9 9"/><path d="m8 12 3 3 9-9"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',back:'<path d="m15 18-6-6 6-6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',bookmark:'<path d="M5 3h14v18l-7-5-7 5z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',edit:'<path d="m15 5 4 4M4 20l4-1 12-12-3-3L5 16z"/>',check:'<path d="m4 12 5 5L20 6"/>',plus:'<path d="M12 5v14m-7-7h14"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>'};
const I=(n,sz=20)=>'<svg class="icon" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.arrow)+'</svg>';
const demo=[
{id:'a',title:'高位下拉：从动作到肌肉发力',cat:'运动健身',tags:['力量训练','动作技术'],fav:true,created:'2026-11-12',style:'detail',text:'高位下拉时，双手握距略宽于肩，保持躯干稳定。先理解肩胛运动，再让肘部沿自然轨迹向下移动。不要为了触碰胸部而过度后仰。回程时保持动作控制，感受背阔肌的拉长。',brief:'# 高位下拉：关键要点\n\n- 握距略宽于肩，正手完整握持。\n- 保持躯干稳定，肘部向下移动。\n- 不追求触胸，避免猛拉和耸肩。\n- 离心阶段缓慢控制。',detail:'# 一、动作目标\n\n高位下拉是针对背部肌群的常见训练动作，重点在于控制肘部路径和肩胛骨运动。\n\n# 二、准备姿势\n\n握距略宽于肩，正手握住横杆。调整座椅，使大腿能够稳定固定。\n\n# 三、发力流程\n\n1. 轻微后仰，保持胸廓自然。\n2. 肘部向下、向身体两侧移动。\n3. 肩胛骨在下拉过程中参与下降、适度后缩与下回旋。\n4. 向上还原时保持控制，不要突然放松。\n\n# 四、常见错误\n\n- 大幅度借力后仰。\n- 为了碰胸牺牲关节活动范围。\n- 过度耸肩或突然甩动重量。\n\n> 学习提醒：先把动作做稳定，再逐渐提高重量。',book:'# 第一章：理解高位下拉\n\n## 1.1 训练目的\n\n高位下拉通过肩关节内收和肩胛骨协同运动，训练背阔肌等参与肌群。\n\n## 1.2 动作准备\n\n调整座椅和重量，使身体能够稳定控制。完整握杆，保持腕关节中立。\n\n## 1.3 动作实施\n\n强调肘部下移而非只关注手柄位置。躯干保持轻度后仰，避免过度伸展腰部。\n\n## 1.4 纠错与自测\n\n问自己：动作是否平稳？是否为了增加重量而借力？回程是否失控？\n\n## 1.5 总结\n\n稳定、有效活动范围和可重复的控制质量，比追求动作外观更重要。',cards:[['高位下拉的主要动作提示是什么？','稳定躯干，让肘部自然向下移动。'],['回程需要注意什么？','控制离心过程，避免突然放松。']]},
{id:'b',title:'为什么主动回忆比重复阅读更重要',cat:'心理学',tags:['学习方法','记忆'],fav:false,created:'2026-11-11',style:'detail',text:'学习不是把资料反复看熟，而是能够主动从记忆中提取信息。主动回忆意味着先遮住答案尝试回答，再对照原文。间隔复习把学习安排在多个不同时间点，有助于长期保持。',brief:'# 学习效率的三个要点\n\n- 复述比单纯重读更有检验价值。\n- 先回答，再核对答案。\n- 将复习分散到不同日期。',detail:'# 一、识别真正的掌握\n\n阅读时的熟悉感不等于能够独立回忆。只有当资料被遮挡，学习者仍能解释概念，才能更准确地检验记忆。\n\n# 二、主动回忆\n\n学习之后，尝试不看笔记回答问题。答案不完整时回到原文纠错，再进行下一次尝试。\n\n# 三、间隔复习\n\n不要把所有时间用于同一天的重复阅读。将复习安排在多个日期，有助于减少遗忘。\n\n# 四、实践\n\n每完成一篇笔记，生成少量问题。每天完成一轮短时复习，并标记自己还不熟悉的内容。',book:'# 第一章：学习与记忆\n\n## 1.1 熟悉感的陷阱\n\n重复阅读容易产生“我已经懂了”的主观感受，但这种熟悉感并不等于具备回忆或应用能力。\n\n## 1.2 主动提取\n\n先遮住材料，再努力解释学习内容。提取困难的地方，可以帮助识别薄弱知识。\n\n## 1.3 间隔练习\n\n通过分散安排复习，增加不同时间点的提取机会。\n\n## 1.4 实际使用\n\n每一份笔记后放置问题，复习时先独立尝试，再核对并修正理解。',cards:[['什么是主动回忆？','不查看资料，尝试从记忆中回答问题，再对照纠错。'],['熟悉感为什么不等于掌握？','因为看懂某句话，不代表能独立提取或应用。']]},
{id:'c',title:'存款利率：名义收益与真实购买力',cat:'经济金融',tags:['利率','金融常识'],fav:false,created:'2026-11-09',style:'detail',text:'名义利率反映存款合同规定的利息增长。实际利率还要考虑物价变化。比较不同期限产品，不应只关注广告中的年化数字，还要看计息规则、流动性和风险。',brief:'# 存款利率的核心区别\n\n- 名义利率描述金额的变化。\n- 实际利率考虑购买力。\n- 比较产品还要看期限与规则。',detail:'# 一、名义利率\n\n名义利率通常是合同或市场报价中直接显示的利率水平。\n\n# 二、实际利率\n\n实际利率考虑物价水平变化。简化近似关系为：实际利率 ≈ 名义利率 − 通货膨胀率。\n\n# 三、实际判断\n\n选择储蓄产品时，除收益以外还要看期限、提前支取规定、流动性及适用条件。',book:'# 第一章：存款利率基础\n\n## 1.1 名义利率\n\n名义利率用于计算以货币表示的利息收入。\n\n## 1.2 实际利率\n\n实际利率用于衡量购买力变化。精确关系：(1+名义利率)/(1+通胀率)-1。\n\n## 1.3 比较原则\n\n应将计息方式、期限、提前支取规则、风险等因素纳入比较，而不是只比较单个利率数字。',cards:[['实际利率近似等于什么？','名义利率减去通货膨胀率。']]}];
const seed=()=>({notes:demo,cards:[],logs:[],task:null});let db;try{db=JSON.parse(localStorage.getItem('zhixu_premium_1'))||seed()}catch(e){db=seed()}if(!Array.isArray(db.notes))db=seed();if(!Array.isArray(db.cards))db.cards=[];if(!Array.isArray(db.logs))db.logs=[];

let s={page:'home',id:null,mode:'detail',tab:'note',category:'全部',q:'',modal:null,chat:[],answer:false,reviewIndex:0,reviewIds:[],rememberScroll:0};const getNote=()=>db.notes.find(x=>x.id===s.id), noteBody=n=>n?.[n.style||'detail']||n?.detail||'', counts=()=>db.cards.filter(x=>!x.due||x.due<=today()).length;let timer=null;

const tabnav=()=>'<nav class="nav">'+[['home','首页'],['library','知识库'],['review','复习'],['settings','我的']].map(([id,t])=>'<button data-page="'+id+'" class="'+(s.page===id?'active':'')+'">'+I(id)+'<span>'+t+'</span></button>').join('')+'</nav>';
const preview=n=>(n.detail||n.text||'').replace(/[#*\n]/g,' ').slice(0,90);
function article(n,index){return '<div class="article" data-open="'+esc(n.id)+'"><div class="number">'+String(index+1).padStart(2,'0')+'</div><div class="grow"><div class="tiny">'+esc(n.cat)+' · '+esc(n.created)+'</div><h3>'+esc(n.title)+'</h3><div class="desc">'+esc(preview(n))+'</div></div><div style="color:var(--muted);margin-top:20px">'+I('arrow',16)+'</div></div>'}
function home(){const n=db.notes[0],due=counts();return head('<span class="tiny">PRIVATE LIBRARY · PREVIEW</span>')+'<main class="main"><div style="margin-top:21px"><div class="eyebrow">A QUIETER WAY TO LEARN</div><h1 class="display">把好内容，<br>慢慢读懂。</h1><div class="hint">收集值得留下的知识，建立自己的理解。</div></div><div class="import"><div class="eyebrow">01 / COLLECT</div><h2>收录一段新知识</h2><div class="hint">粘贴链接，从观看走向思考。</div><div class="inputline"><input id="link" placeholder="粘贴抖音分享链接…" value=""><button class="go" data-action="import" aria-label="导入链接">'+I('arrow',19)+'</button></div><div class="micro"><i></i> 演示模式 · 不会实际下载视频</div></div>'+(db.task?'<div class="task"><div class="taskline"><span>'+esc(db.task.stage)+'</span><span>'+db.task.progress+'%</span></div><div class="progresswrap"><div class="progressbar" style="width:'+db.task.progress+'%"></div></div>'+(db.task.status==='failed'?'<button class="link" data-action="retry">重试该任务 →</button>':'')+'</div>':'')+'<div class="metrics"><div><div class="tiny">已收录笔记</div><strong>'+db.notes.length+'</strong><small>值得回看的内容</small></div><div><div class="tiny">今日待复习</div><strong>'+due+'</strong><small>张记忆卡片</small></div></div><hr class="sep"><div class="row between"><h2 class="section">继续阅读</h2><button class="link" data-page="library">查看全部 '+I('arrow',13)+'</button></div>'+(n?'<div class="statement" data-open="'+esc(n.id)+'"><div class="eyebrow">EDITOR’S PICK · '+esc(n.cat)+'</div><p class="serif" style="font-size:20px;font-weight:600;line-height:1.55">'+esc(n.title)+'</p><div class="row between"><span class="tiny">轻触继续学习</span>'+I('arrow',17)+'</div></div>':'')+'<div class="row between" style="margin-top:21px"><h2 class="section">最近加入</h2><span class="catalog">RECENT NOTES</span></div>'+db.notes.slice(0,3).map(article).join('')+'</main>'+tabnav()}
function library(){const cats=['全部','运动健身','心理学','经济金融','哲学','未分类'];const filtered=()=>db.notes.filter(n=>(s.category==='全部'||n.cat===s.category||s.category==='收藏'&&n.fav)&&((n.title+' '+n.text+' '+noteBody(n)+' '+(n.tags||[]).join(' ')).toLowerCase().includes(s.q.toLowerCase())));return head('<span class="tiny">THE ARCHIVE</span>')+'<main class="main"><div class="eyebrow" style="margin-top:19px">02 / COLLECTION</div><h1 class="heading">知识库</h1><p class="hint">把零散的观看，整理成有序的积累。</p><input class="search" id="search" placeholder="搜索标题、正文、标签…" value="'+esc(s.q)+'"><div class="chips">'+[...cats,'收藏'].map(c=>'<button class="chip '+(s.category===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('')+'</div><div class="row between" style="margin-top:14px"><span class="tiny" id="resultcount">'+filtered().length+' 条资料</span><span class="catalog">ALL NOTES</span></div><div id="notelist">'+(filtered().map(article).join('')||'<div class="empty">这里还没有相关资料。<br>换个关键词试试看。</div>')+'</div></main>'+tabnav()}
function markdown(md){const lines=esc(md).split('\n');let out='',inList=false;for(const line of lines){if(/^- /.test(line)){if(!inList){out+='<ul>';inList=true}out+='<li>'+line.slice(2)+'</li>';continue}if(inList){out+='</ul>';inList=false}if(line.startsWith('### '))out+='<h3>'+line.slice(4)+'</h3>';else if(line.startsWith('## '))out+='<h2>'+line.slice(3)+'</h2>';else if(line.startsWith('# '))out+='<h2>'+line.slice(2)+'</h2>';else if(line.startsWith('&gt; '))out+='<blockquote>'+line.slice(5)+'</blockquote>';else if(line.trim())out+='<p>'+line.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</p>'}if(inList)out+='</ul>';return out}
function detail(){const n=getNote();if(!n)return home();const content=s.tab==='note'?markdown(noteBody(n)):s.tab==='source'?'<p style="white-space:pre-wrap;line-height:2">'+esc(n.text||'暂无文字稿')+'</p>':'<div class="notice">当前是离线交互演示版，视频尚未连接至原有抖音解析模块。你仍可阅读文字稿和笔记。</div>';const modes=[['brief','精简'],['detail','详细'],['book','教材']];return '<header class="top"><button class="iconbtn" data-action="back" aria-label="返回">'+I('back')+'</button><span class="tiny">READING ROOM</span><button class="iconbtn" data-action="more" aria-label="更多">'+I('more')+'</button></header><main class="main" id="reading"><div class="eyebrow" style="margin-top:13px">ARCHIVE / '+esc(n.cat)+'</div><h1 class="detailtitle">'+esc(n.title)+'</h1><div class="row between"><span class="tiny">'+esc(n.created)+' · '+esc((n.tags||[]).join(' / '))+'</span><button class="iconbtn" style="color:'+(n.fav?'var(--ochre)':'var(--soft)')+'" data-action="fav">'+I('bookmark')+'</button></div><div class="tabs">'+[['note','学习笔记'],['source','原始文字'],['video','视频']].map(([key,label])=>'<button data-tab="'+key+'" class="'+(s.tab===key?'active':'')+'">'+label+'</button>').join('')+'</div>'+(s.tab==='note'?'<div class="row between" style="margin-bottom:10px"><span class="tiny">整理风格</span><div class="row" style="gap:5px">'+modes.map(([id,label])=>'<button class="chip '+(n.style===id?'active':'')+'" data-style="'+id+'" style="padding:6px 10px">'+label+'</button>').join('')+'</div></div><button class="link" data-action="outline">章节目录 / CONTENTS →</button>':'')+'<div class="markdown" id="notecontent">'+content+'</div><div class="tools"><button class="btn ghost" data-action="edit">'+I('edit',16)+' 编辑</button><button class="btn ghost" data-action="chat">问一问</button><button class="btn dark" data-action="cards">生成复习卡</button></div></main>'}
function review(){const due=db.cards.filter(c=>!c.due||c.due<=today());return head('<span class="tiny">REMEMBER BETTER</span>')+'<main class="main"><div style="margin-top:25px" class="eyebrow">03 / REVISIT</div><h1 class="heading">温故，而知新。</h1><p class="hint">真正记住的，不是看过多少，而是还能想起多少。</p><div class="statement" style="padding:26px 23px;margin-top:27px"><div class="eyebrow">TODAY’S PRACTICE</div><div style="font-family:Georgia,serif;font-size:65px;line-height:1.4">'+due.length+'</div><div class="tiny">张卡片待复习</div><button class="btn dark full" data-action="startReview" style="margin-top:19px" '+(!due.length?'disabled':'')+'>'+ (due.length?'开始今天的复习':'今天已完成')+' '+I('arrow',17)+'</button></div><hr class="sep"><h2 class="section">复习方法</h2><div class="article"><div class="number">01</div><div class="grow"><h3>先独立回答</h3><div class="hint">不急着翻看答案，试着说出自己的理解。</div></div></div><div class="article"><div class="number">02</div><div class="grow"><h3>对照并修正</h3><div class="hint">承认不确定的地方，比机械重复更重要。</div></div></div><div class="article"><div class="number">03</div><div class="grow"><h3>适时重新遇见</h3><div class="hint">依据掌握情况，安排下次复习。</div></div></div><p class="tiny" style="margin-top:24px">已建立 '+db.cards.length+' 张卡片 · 完成 '+db.logs.length+' 次复习</p></main>'+tabnav()}
function quiz(){const c=db.cards.find(c=>c.id===s.reviewIds[s.reviewIndex]);if(!c){s.page='review';return review()}const n=db.notes.find(n=>n.id===c.itemId);return '<header class="top"><button class="iconbtn" data-action="endReview">'+I('back')+'</button><span class="tiny">RECALL SESSION</span><span class="tiny">'+(s.reviewIndex+1)+' / '+s.reviewIds.length+'</span></header><main class="main"><div style="margin-top:25px" class="eyebrow">ACTIVE RECALL</div><div class="progresswrap" style="margin-top:14px"><div class="progressbar" style="width:'+((s.reviewIndex)/s.reviewIds.length*100)+'%"></div></div><div class="cardqa"><span class="eyebrow" style="margin-bottom:20px">QUESTION '+String(s.reviewIndex+1).padStart(2,'0')+'</span><div class="question">'+esc(c.q)+'</div>'+(s.answer?'<div class="answer"><hr class="sep"><span class="eyebrow">REFERENCE ANSWER</span><p>'+esc(c.a)+'</p></div>':'<div class="hint" style="margin-top:23px">先想一想，再查看答案。</div>')+'</div><div class="tiny">'+esc(n?.title||'学习卡片')+'</div><div style="height:22px"></div>'+(s.answer?'<div class="sheetrow"><button class="btn ghost" data-rating="forget">忘记了</button><button class="btn ghost" data-rating="fuzzy">有点模糊</button><button class="btn dark" data-rating="know">记住了</button></div>':'<button class="btn dark full" data-action="reveal">查看参考答案 '+I('arrow',17)+'</button>')+'</main>'}
function settings(){return head('<span class="tiny">ABOUT YOUR SPACE</span>')+'<main class="main"><div class="eyebrow" style="margin-top:21px">04 / SETTINGS</div><h1 class="heading">一个安静的学习角落。</h1><p class="hint">资料保存在本机。没有账号、没有推荐流、没有打卡压力。</p><div class="statement" style="background:#efece4"><div class="eyebrow">ZHIXU / PREVIEW 1.0</div><p class="serif" style="font-size:19px">阅读、理解、记忆。<br>留下真正属于自己的知识。</p></div><div class="actionlist"><button data-action="backup">导出全部资料备份　↗</button><button data-action="restore">从备份恢复资料　↗</button><button data-action="reset">重置演示内容　↗</button><button data-action="help">关于本演示版　↗</button></div><p class="hint" style="margin-top:27px">此版本用于验证产品设计。视频下载与语音识别尚未接入，AI 整理和问答均为演示交互。</p></main>'+tabnav()}
function render(){const keep=$('#reading')?.scrollTop||0;app.innerHTML=s.page==='home'?home():s.page==='library'?library():s.page==='detail'?detail():s.page==='review'?review():s.page==='quiz'?quiz():settings();if(s.page==='detail'&&keep>0)$('#reading').scrollTop=keep;}
function open(id){s.id=id;s.page='detail';s.tab='note';render();}function back(){if(s.page==='detail'){s.page='library';s.id=null}else if(s.page==='quiz')s.page='review';else s.page='home';render()}
function showModal(title,body){const w=document.createElement('div');w.className='modalwrap';w.id='overlay';w.innerHTML='<div class="modal"><div class="modalHead"><span class="eyebrow">ZHIXU / WORKSPACE</span><button class="close" data-action="close">×</button></div><h2>'+title+'</h2>'+body+'</div>';app.appendChild(w)}function close(){$('#overlay')?.remove()}
function importLink(){const value=$('#link')?.value.trim()||'';if(!/https?:\/\/\S+/i.test(value))return toast('请先粘贴有效链接');if(db.task?.status==='running')return toast('已有任务正在处理');db.task={url:value,progress:0,status:'running',stage:'准备解析链接…'};save();render();runTask()}function runTask(){if(timer)clearInterval(timer);timer=setInterval(()=>{if(!db.task||db.task.status!=='running'){clearInterval(timer);return}db.task.progress=Math.min(100,db.task.progress+20);db.task.stage=db.task.progress<=20?'解析视频链接…':db.task.progress<=45?'读取音视频…':db.task.progress<=70?'提取文字稿（演示）…':db.task.progress<100?'整理知识资料（演示）…':'完成';if(db.task.progress>=100){db.task.status='finished';clearInterval(timer);const id=uid();db.notes.unshift({id,title:'新收录视频 · 演示知识笔记',cat:'未分类',tags:['待整理'],created:today(),style:'detail',fav:false,src:db.task.url,text:'这是导入流程演示。没有实际连接抖音、语音识别及大语言模型。可进入笔记编辑粘贴自己的文字稿。',brief:'# 新视频已收录\n\n演示流程完成。请粘贴你真实的文字稿并修改学习笔记。',detail:'# 这是一份演示笔记\n\n视频导入进度、知识库归档和笔记管理可以正常体验。\n\n# 下一步\n\n通过「编辑」修改笔记，或查看原始文字稿。\n\n> 演示版本没有实际解析、下载或 AI 整理。',book:'# 第一章：资料整理\n\n## 本地演示\n\n请在正式版本连接原有视频解析、语音识别和 AI 服务后生成真实笔记。',cards:[]});db.task=null;toast('已加入知识库 · 演示资料');s.page='detail';s.id=id;render()}else render();save()},400)}
function exportFile(name,content,type){if(window.Android?.saveFile){window.Android.saveFile(name,content,type);return}const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function promptEdit(){const n=getNote();showModal('编辑学习笔记','<div class="label">标题</div><input class="field" id="editTitle" value="'+esc(n.title)+'"><div class="label">正文 · 支持 Markdown</div><textarea class="field area" id="editText" style="min-height:260px">'+esc(s.tab==='source'?n.text:noteBody(n))+'</textarea><button class="btn dark full" style="margin-top:15px" data-action="saveEdit">保存修改</button>')}
function more(){showModal('资料管理','<div class="actionlist"><button data-action="outline">查看章节目录　↗</button><button data-action="category">修改分类与标签　↗</button><button data-action="exportMd">导出 Markdown　↗</button><button data-action="exportPdf">导出 / 打印 PDF　↗</button><button data-action="delete">删除此资料　↗</button></div>')}
function outline(){close();const n=getNote(), titles=[...noteBody(n).matchAll(/^#{1,3}\s+(.+)/gm)];showModal('章节目录','<div class="actionlist">'+(titles.length?titles.map((m,i)=>'<button data-jump="'+i+'">'+esc(m[1])+'　↗</button>').join(''):'<p class="hint">当前笔记没有章节标题。</p>')+'</div>')}
function category(){close();const n=getNote();showModal('整理资料','<div class="label">所属分类</div><select id="editCat" class="field">'+['运动健身','心理学','经济金融','哲学','未分类'].map(c=>'<option '+(c===n.cat?'selected':'')+'>'+c+'</option>').join('')+'</select><div class="label">标签 · 使用逗号分隔</div><input id="editTags" class="field" value="'+esc((n.tags||[]).join(', '))+'"><button class="btn dark full" data-action="saveCategory" style="margin-top:16px">保存资料信息</button>')}
function chat(){s.chat=[];showModal('围绕这篇笔记提问','<div class="notice">演示问答采用本地规则回复，不是真实 AI 推理。</div><div id="chatlog"><div class="chatbubble">你可以问：这篇笔记的核心观点是什么？</div></div><div class="row" style="margin-top:16px"><input id="ask" class="field" placeholder="输入你的问题…"><button class="btn dark" data-action="ask">发送</button></div>')}
function ask(){const n=getNote(),q=$('#ask')?.value.trim();if(!q)return;const answer='这是一段用于体验提问流程的本地示例回复。\n\n当前笔记主题：'+n.title+'。\n\n资料参考：'+(n.detail||n.text).replace(/[#*\n]/g,' ').slice(0,135)+'…\n\n正式版本接入模型后才能进行真实语义理解。';const log=$('#chatlog');log.innerHTML+='<div class="chatbubble user">'+esc(q)+'</div><div class="chatbubble">'+esc(answer)+'</div>';$('#ask').value='';log.lastElementChild.scrollIntoView({block:'nearest'})}
function cards(){const n=getNote(),existing=db.cards.filter(c=>c.itemId===n.id);showModal('把理解变成记忆','<p class="hint">从知识点生成问题，留给以后的自己来回答。</p><div class="statement"><div class="eyebrow">RECALL CARDS</div><p>当前已有 '+existing.length+' 张记忆卡片</p></div><button class="btn dark full" data-action="generateCards">生成演示复习卡片</button><p class="hint" style="margin-top:11px">演示版使用内置样例和文字稿提取规则，不调用 AI。</p>')}
function generateCards(){const n=getNote();const list=n.cards?.length?n.cards:[['这段资料主要探讨什么？',n.text.slice(0,130)||'请回到笔记复述内容。'],['你能复述一个重要结论吗？',noteBody(n).replace(/[#*\n]/g,' ').slice(0,130)]];for(const [q,a] of list){if(!db.cards.some(c=>c.itemId===n.id&&c.q===q))db.cards.push({id:uid(),itemId:n.id,q,a,stage:0,due:today()})}save();close();toast('复习卡片已加入今日计划');}
function startReview(){s.reviewIds=db.cards.filter(c=>!c.due||c.due<=today()).map(c=>c.id);if(!s.reviewIds.length)return toast('今天暂时没有待复习的内容');s.reviewIndex=0;s.answer=false;s.page='quiz';render()}
function rate(choice){const c=db.cards.find(x=>x.id===s.reviewIds[s.reviewIndex]);if(!c)return;c.stage=choice==='forget'?0:choice==='fuzzy'?Math.max(0,(c.stage||0)-1):Math.min(4,(c.stage||0)+1);const days=choice==='forget'?1:choice==='fuzzy'?3:[1,3,7,14,30][c.stage];const due=new Date();due.setDate(due.getDate()+days);c.due=due.toISOString().slice(0,10);db.logs.push({id:uid(),cardId:c.id,rating:choice,at:Date.now()});save();s.reviewIndex++;s.answer=false;if(s.reviewIndex===s.reviewIds.length){s.page='review';render();toast('今天的复习完成了')}else render()}
function exportMd(){const n=getNote();close();exportFile(n.title.replace(/[\\/:*?"<>|]/g,'_')+'.md','# '+n.title+'\n\n'+noteBody(n)+'\n\n来源：'+(n.src||'演示资料'),'text/markdown');toast('已发起 Markdown 导出')}
function exportPdf(){const n=getNote();close();if(window.Android?.printPdf){const old=app.innerHTML;window.Android.printPdf('<html><meta charset="utf-8"><body style="font-family:sans-serif;padding:35px"><h1>'+esc(n.title)+'</h1>'+markdown(noteBody(n))+'</body></html>');toast('请在系统打印中保存为 PDF')}else{const w=window.open('','_blank');if(w){w.document.write('<html><meta charset="utf-8"><body style="font-family:sans-serif;padding:30px"><h1>'+esc(n.title)+'</h1>'+markdown(noteBody(n))+'</body></html>');w.document.close();w.print()}}}
function help(){showModal('关于知序','<p class="hint">知序是一款知识学习 APP 的独立交互演示。它提供真实的本地笔记编辑、收藏、搜索、卡片复习与备份能力。<br><br>视频链接导入、AI 整理和 AI 问答为演示功能，尚未连接既有抖音工具链或大模型。<br><br>数据默认仅保存在当前设备。</p><div class="eyebrow" style="margin-top:20px">PREVIEW BUILD / 1.0</div>')}
app.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-open],[data-action],[data-tab],[data-cat],[data-style],[data-rating],[data-jump]');if(!t)return;const d=t.dataset;if(d.page){s.page=d.page;s.id=null;render();return}if(d.open){open(d.open);return}if(d.cat){s.category=d.cat;render();return}if(d.tab){s.tab=d.tab;render();return}if(d.style){getNote().style=d.style;save();render();return}if(d.rating){rate(d.rating);return}if(d.jump!=null){const i=Number(d.jump);close();const heads=[...$('#notecontent')?.querySelectorAll('h1,h2,h3')||[]];heads[i]?.scrollIntoView({behavior:'smooth',block:'start'});return}switch(d.action){case 'import':importLink();break;case 'back':back();break;case 'close':close();break;case 'more':more();break;case 'fav':{const n=getNote();n.fav=!n.fav;save();render();toast(n.fav?'已加入收藏':'已取消收藏');break}case 'edit':promptEdit();break;case 'saveEdit':{const n=getNote();n.title=$('#editTitle').value.trim()||n.title;const text=$('#editText').value.trim();if(!text)return toast('内容不能为空');if(s.tab==='source')n.text=text;else n[n.style]=text;save();close();render();toast('修改已保存');break}case 'outline':outline();break;case 'category':category();break;case 'saveCategory':{const n=getNote();n.cat=$('#editCat').value;n.tags=[...new Set($('#editTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean))];save();close();render();toast('资料已更新');break}case 'chat':chat();break;case 'ask':ask();break;case 'cards':cards();break;case 'generateCards':generateCards();break;case 'startReview':startReview();break;case 'reveal':s.answer=true;render();break;case 'endReview':s.page='review';render();break;case 'exportMd':exportMd();break;case 'exportPdf':exportPdf();break;case 'delete':{if(confirm('删除该笔记及其复习卡片？')){db.notes=db.notes.filter(n=>n.id!==s.id);db.cards=db.cards.filter(c=>c.itemId!==s.id);save();close();s.page='library';render();toast('已删除')}break}case 'backup':exportFile('知序-本地备份.json',JSON.stringify(db,null,2),'application/json');toast('已发起备份导出');break;case 'restore':{showModal('恢复备份','<p class="hint">请使用系统文件选择器选择此前导出的 JSON 文件。</p><input type="file" accept=".json,application/json" id="restoreFile" class="field">');break}case 'reset':if(confirm('将清除所有当前演示数据并恢复三个样例，确定继续？')){db=seed();save();s.page='home';render()}break;case 'help':help();break;case 'retry':db.task.status='running';runTask();break;}})
app.addEventListener('input',e=>{if(e.target.id==='search'){s.q=e.target.value;const list=db.notes.filter(n=>(s.category==='全部'||n.cat===s.category||s.category==='收藏'&&n.fav)&&((n.title+' '+n.text+' '+noteBody(n)+' '+(n.tags||[]).join(' ')).toLowerCase().includes(s.q.toLowerCase())));$('#notelist').innerHTML=list.map(article).join('')||'<div class="empty">没有找到相关内容。</div>';$('#resultcount').textContent=list.length+' 条资料';}if(e.target.id==='restoreFile'){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.notes)||!Array.isArray(d.cards))throw Error('格式不正确');if(!confirm('恢复会覆盖当前资料，确定继续？'))return;db=d;save();close();s.page='home';render();toast('备份已恢复')}catch(err){toast('文件无法识别')}};reader.readAsText(f)}});
window.demoBack=()=>{if($('#overlay')){close();return true}if(s.page!=='home'){back();return true}return false};
render();
})();
</script></body></html>
