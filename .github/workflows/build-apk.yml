name: Build and publish Zhiyin Qwen3-ASR 0.7.2 background
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    if: github.repository == '3234149093guge-svg/gpt1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download verified Qwen3 capable sherpa-onnx AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 4 --retry-delay 3 -o app/libs/sherpa-onnx-1.12.34.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.34/sherpa-onnx-1.12.34.aar
          echo '9042637b206ef2dd98ea3a2fe28ffaa7e8767557848d94b5e25c268db188535b  app/libs/sherpa-onnx-1.12.34.aar' | sha256sum -c -
          unzip -l app/libs/sherpa-onnx-1.12.34.aar | grep 'libsherpa-onnx-jni.so'
      - name: Compile Android app
        run: gradle --no-daemon assembleDebug
      - name: Verify installable package and model-free distribution
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$APK" | grep 'assets/index.html'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.example.douyinexport.background'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep 'TranscriptionService'
          grep -q 'default void onSegment' app/src/main/java/com/example/douyinexport/OfflineTranscriber.java
          grep -q 'int threads=2;' app/src/main/java/com/example/douyinexport/OfflineTranscriber.java
          grep -q 'FOREGROUND_SERVICE_MEDIA_PROCESSING' app/src/main/AndroidManifest.xml
          grep -q 'startForegroundService(task)' app/src/main/java/com/example/douyinexport/MainActivity.java
          if unzip -Z1 "$APK" | grep -E '(^|/)(encoder[.]int8[.]onnx|decoder[.]int8[.]onnx|conv_frontend[.]onnx|model[.]int8[.]onnx|sensevoice)' ; then
            echo "Unexpected model data included in APK" >&2
            exit 1
          fi
          cp "$APK" Zhiyin-Qwen3-ASR-0.6B-INT8-v0.7.2-background.apk
          sha256sum Zhiyin-Qwen3-ASR-0.6B-INT8-v0.7.2-background.apk
          ls -lh Zhiyin-Qwen3-ASR-0.6B-INT8-v0.7.2-background.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zhiyin-Qwen3-ASR-0.6B-INT8-v0.7.2-background-APK
          path: Zhiyin-Qwen3-ASR-0.6B-INT8-v0.7.2-background.apk
          retention-days: 30
      - name: Publish GitHub release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.7.2-qwen3-asr-background'
          FILE='Zhiyin-Qwen3-ASR-0.6B-INT8-v0.7.2-background.apk'
          cat > release-notes.md <<'EOF'
          知音 v0.7.2 · Qwen3-ASR-0.6B INT8 后台识别

          - 真正的 Android Foreground Service：识别任务从 Activity 普通线程移入系统前台服务，切换微信/抖音等其他软件后可继续处理。
          - 持续通知：展示后台处理进度，点击可返回知音，通知栏提供停止入口。
          - 逐段原子保存 TXT/SRT：每识别完一段即写入应用私有存储，即使系统强制结束进程也能保留已完成段落。
          - 页面重进或切回 App 自动恢复状态、部分文本、完整文字稿与 SRT。
          - 遵循用户要求，固定原版 2 CPU 线程（不是两个进程），仍用 Qwen3-ASR-0.6B INT8，同一解码参数、16kHz、原语音分段。
          - Android 15+ 使用 mediaProcessing 前台服务类型；Android 14 使用 dataSync（本地文件处理），需要系统前台服务许可；Android 13+ 请求通知权限。
          - 使用新的应用 ID，可与原 v0.7 和 v0.7.1 并存，避免覆盖旧调试签名 APK；因应用沙盒隔离，新版首次仍需下载或导入官方模型包。
          - 未经荣耀 Magic7 真机切换应用的实测；后台任务仍可能因强制停止、省电策略、系统内存压力而中断。不会自动从中断点重新推理，但已完成的文字有保存。
          - 编译与 APK 结构由 GitHub Actions 校验。建议 Android ARM64 8GB RAM 以上。

          官方模型：
          https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25.tar.bz2
          SHA-256: 393f8a14e2f5fb96746aaab342997a40641001fbd5bf9592a080a8329178ee96
          EOF
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$FILE" --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "知音 v0.7.2 · Qwen3-ASR 后台持续识别" \
              --prerelease --notes-file release-notes.md
          fi
