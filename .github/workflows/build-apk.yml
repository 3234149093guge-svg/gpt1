name: Build Android video-only APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK without speech models or API
        run: gradle --no-daemon assembleDebug
      - name: Check video-only APK and absence of model
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          if unzip -Z1 "$APK" | grep -E '(sensevoice|model-cn|libsherpa|onnx|vosk|[.]kt$)' ; then
            echo "Unwanted speech model included" >&2
            exit 1
          fi
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: zhiyin-video-only-v060-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
