name: Probe Douyin public share data
on:
  push:
    paths:
      - .github/workflows/douyin-probe.yml
  workflow_dispatch:
jobs:
  inspect-public-html:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect HTML metadata only (no media downloads)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          id="7410584369103965490"
          ios="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          android="Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36"
          for agent_name,agent in [('iPhone',ios),('Android',android)]:
            for host in ['www.douyin.com','www.iesdouyin.com']:
              url=f'https://{host}/share/video/{id}/'
              try:
                req=urllib.request.Request(url,headers={'User-Agent':agent,'Accept':'text/html,application/xhtml+xml,*/*','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.douyin.com/'})
                with urllib.request.urlopen(req,timeout=17) as resp:
                  data=resp.read(6000000)
                  text=data.decode('utf-8','replace')
                  flags={x:(x in text) for x in ['_ROUTER_DATA','videoInfoRes','play_addr','playAddr','__UNIVERSAL_DATA_FOR_REHYDRATION__','_SSR_DATA','ArgusSecurityPlugin','RENDER_DATA','<video']}
                  print(f'{agent_name} {host} HTTP={resp.status} length={len(data)} urlhost={urllib.request.urlparse(resp.url).hostname} flags={flags}',flush=True)
              except Exception as e:
                print(f'{agent_name} {host} error={type(e).__name__}: {str(e)[:150]}',flush=True)
          PY
