name: Build Zhixu Premium Preview APK
on:
  push:
    branches: [zhixu-premium-demo]
    paths:
      - 'demo/**'
      - '.github/workflows/build-zhixu-premium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check interactive HTML JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("demo/app/src/main/assets/index.html").read_text()
          code=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/zhixu-preview.js").write_text(code)
          PY
          node --check /tmp/zhixu-preview.js
      - run: gradle --no-daemon --project-dir demo assembleDebug
      - run: test -s demo/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zhixu-Premium-Preview-APK
          path: demo/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Zhixu-Layout-Source
          path: demo/app/src/main/assets/index.html
          retention-days: 30
