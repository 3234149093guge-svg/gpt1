name: Verify Android parser with actual Douyin share HTML
on:
  push:
    paths:
      - .github/workflows/verify-android-parser.yml
      - app/src/main/java/com/example/douyinexport/MainActivity.java
  workflow_dispatch:
jobs:
  verify-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch real public share HTML (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, http.cookiejar, re, time, pathlib, sys
          id='7410584369103965490'
          link='https://v.douyin.com/NRlGp9fKoMs/'
          ios='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
          android='Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36'
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          tests=[
            (link,android),(link,ios),
            (f'https://www.douyin.com/share/video/{id}/',ios),
            (f'https://www.iesdouyin.com/share/video/{id}/',ios),
            (f'https://www.douyin.com/share/video/{id}/',android),
            (f'https://www.iesdouyin.com/share/video/{id}/',android)
          ]
          for n,(url,ua) in enumerate(tests,1):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,*/*','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.douyin.com/'})
              with opener.open(req,timeout=24) as resp:
                data=resp.read(6_000_000).decode('utf-8','replace')
              valid=('videoInfoRes' in data and 'play_addr' in data)
              print('HTTP_TEST',n,'bytes',len(data),'videoData',valid,flush=True)
              if valid:
                pathlib.Path('/tmp/douyin-share.html').write_text(data,encoding='utf-8')
                pathlib.Path('/tmp/douyin-ua.txt').write_text('ios' if 'iPhone' in ua else 'android')
                break
            except Exception as e:
              print('HTTP_TEST',n,type(e).__name__,str(e)[:100],flush=True)
          else:
            print('NO_MEDIA_METADATA_RETURNED');sys.exit(1)
          PY
      - name: Compile the EXACT JSON parsing methods extracted from Android source
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/org-json.jar https://repo.maven.apache.org/maven2/org/json/json/20250517/json-20250517.jar
          python3 - <<'PY'
          import pathlib
          code=pathlib.Path('app/src/main/java/com/example/douyinexport/MainActivity.java').read_text()
          start=code.index('    private static String jsonObjectFollowing(')
          end=code.index('    private void resolveLink(String text)',start)
          methods=code[start:end]
          assert 'private static String structuredMedia(' in methods
          assert 'private static String visitMedia(' in methods
          assert 'private static String scanDirectVideo(' in methods
          prefix='''import org.json.*;import java.util.*;import java.util.regex.*;import java.net.*;import java.nio.file.*;
          public class ParserProbe {
          private static boolean https(String value){
             try{return "https".equalsIgnoreCase(new URI(value).getScheme());}catch(Exception e){return false;}
          }
          '''
          suffix='''public static void main(String[] args)throws Exception {
             String html=Files.readString(Path.of("/tmp/douyin-share.html"));
             String media=structuredMedia(html);
             if(media.isEmpty())media=scanDirectVideo(html);
             if(media.isEmpty())throw new AssertionError("ACTUAL_ANDROID_PARSER_CANNOT_GET_VIDEO");
             URL u=new URL(media);
             Files.writeString(Path.of("/tmp/douyin-media-url.txt"),media);
             System.out.println("ACTUAL_ANDROID_PARSER_SUCCESS host="+u.getHost());
             Exception failed=null;
             for(int attempt=1;attempt<=3;attempt++){
               try {
                 HttpURLConnection c=(HttpURLConnection)u.openConnection();
                 c.setConnectTimeout(16000);c.setReadTimeout(20000);
                 c.setRequestProperty("User-Agent","Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36");
                 c.setRequestProperty("Referer","https://www.douyin.com/");
                 c.setRequestProperty("Range","bytes=0-8191");
                 int status=c.getResponseCode();
                 byte[] b=new byte[16];
                 try(var in=c.getInputStream()){
                   int n=in.read(b);
                   if(n<8||b[4]!='f'||b[5]!='t'||b[6]!='y'||b[7]!='p')throw new java.io.IOException("missing mp4 ftyp");
                 }finally{c.disconnect();}
                 if(status!=200&&status!=206)throw new java.io.IOException("HTTP "+status);
                 System.out.println("ANDROID_PARSER_REAL_MP4_BYTES_VERIFIED status="+status);
                 return;
               }catch(Exception e){failed=e;System.out.println("MEDIA_TRY "+attempt+" "+e.getClass().getSimpleName());}
             }
             throw new AssertionError("PARSER_GOT_URL_BUT_NOT_MEDIA",failed);
          }
          }
          '''
          pathlib.Path('/tmp/ParserProbe.java').write_text(prefix+methods+suffix,encoding='utf-8')
          PY
          javac -encoding UTF-8 -cp /tmp/org-json.jar /tmp/ParserProbe.java
          java -cp /tmp:/tmp/org-json.jar ParserProbe
      - name: Download complete sample MP4 and validate video and audio tracks
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          python3 - <<'PY'
          import urllib.request,pathlib
          url=pathlib.Path('/tmp/douyin-media-url.txt').read_text().strip()
          headers={'User-Agent':'Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36',
                   'Referer':'https://www.douyin.com/','Accept':'video/mp4,video/*,*/*'}
          req=urllib.request.Request(url,headers=headers)
          path=pathlib.Path('/tmp/douyin-sample-verified.mp4')
          with urllib.request.urlopen(req,timeout=45) as rsp,open(path,'wb') as w:
            total=0
            while True:
              b=rsp.read(65536)
              if not b:break
              total+=len(b)
              if total>125_000_000:raise RuntimeError('Video exceeds bounded test size')
              w.write(b)
          with open(path,'rb') as f:header=f.read(16)
          assert header[4:8]==b'ftyp',(len(header),header)
          print('FULL_MP4_DOWNLOADED',total,'bytes',flush=True)
          PY
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name -of json /tmp/douyin-sample-verified.mp4 > /tmp/douyin-probe.json
          python3 - <<'PY'
          import json,pathlib
          meta=json.loads(pathlib.Path('/tmp/douyin-probe.json').read_text())
          types={s.get('codec_type') for s in meta.get('streams',[])}
          assert 'video' in types,types
          assert 'audio' in types,types
          print('FULL_VIDEO_AND_AUDIO_VERIFIED',meta,flush=True)
          PY
